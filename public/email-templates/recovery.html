<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Сброс пароля — Zeip</title>
</head>
<body style="margin:0;padding:24px;font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:16px;line-height:1.6;color:#111;background:#fff;">
  <p style="margin:0 0 8px;font-size:13px;color:#666;text-transform:uppercase;letter-spacing:0.04em;">Zeip</p>
  <p style="margin:0 0 16px;font-size:20px;font-weight:600;">Сброс пароля</p>
  {{ if .Token }}
  <p style="margin:0 0 8px;color:#333;">Ваш код:</p>
  <p style="margin:0 0 24px;font-size:32px;font-weight:700;letter-spacing:8px;color:#111;">{{ .Token }}</p>
  {{ end }}
  <p style="margin:0 0 8px;color:#333;">Код действует 10 минут.</p>
  <p style="margin:0 0 8px;color:#333;">Введите код на странице:</p>
  <p style="margin:0 0 24px;color:#333;">https://zeip.ru/auth/reset-password</p>
  <p style="margin:0;font-size:14px;color:#888;">Если вы не запрашивали сброс пароля, проигнорируйте это письмо.</p>
</body>
</html>
